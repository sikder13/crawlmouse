name: CI

# Every push runs the cheap jobs. The visual set (the six visual shards, security-browser and
# zap-baseline) runs when a branch is up for merge: on main, when the branch has an open pull
# request, when a pull request is opened, reopened or marked ready (the `pull_request` trigger, those
# three types only), or when the workflow is dispatched by hand with `visual: true`. On any other push
# the `changes` job defers it and the `visual` job takes another name, so the required check `visual`
# is never reported for that commit. docs/specs/v2/ci-cost.md has the rules and their costs.
#
# A pull request event runs every job, not only the visual set: a job skipped by a condition reports
# success, and a skipped twin of a required check on the head commit could stand in for one that
# failed. It tests the pull request's merge commit, as GitHub checks it out; its checks attach to the
# head commit. A pull request can merge only up to date with main, where the two trees are the same.
#
# The nightly run on main runs everything, the visual set included; a failure is red here, and
# GitHub emails the user who last edited the schedule.
on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      visual:
        description: Run the visual set (the shards, security-browser, ZAP) as if a pull request were open
        type: boolean
        default: false
  schedule:
    - cron: '0 3 * * *' # 03:00 UTC

permissions:
  contents: read

# A newer run of a branch cancels its older run, and a pull request event its older run (its ref is
# refs/pull/<n>/merge, so it never cancels a push run). On main each run has its own group, so no main run
# is cancelled or replaced, not even by a dispatch or the nightly run of the same commit: GitHub also
# drops a PENDING run when a newer one joins its group, and the Prettier job on main checks only what
# that push added.
concurrency:
  group: ci-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  # Whether the visual set runs. `gate` is `open` when the commit is up for merge (main, a pull
  # request event, an open pull request for the branch, or a dispatch with `visual: true`) and
  # `deferred` otherwise. GitHub's
  # answer to "is a pull request open" is the one input from outside the repository; when it cannot
  # be had, the gate opens, as the run would have before this rule. Inside an open gate the path
  # filter decides: the visual set runs unless every file the branch changed is on the reviewed skip
  # list in .github/workflows/scripts/changes.mjs. On main it always runs. On a branch the whole
  # branch is compared with its merge-base on main, not the last push: the required `visual` check
  # attaches to the head commit, so a docs-only commit on top of a rendering change still runs the
  # visuals. The runner's own node and gh run the step; nothing is installed.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      gate: ${{ steps.decide.outputs.gate }}
      visual: ${{ steps.decide.outputs.visual }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Is the commit up for merge, and can anything that affects rendering have changed
        id: decide
        env:
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
          DISPATCH_VISUAL: ${{ inputs.visual }}
          BRANCH: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$REF" = "refs/heads/main" ]; then
            echo "main: everything runs"
            echo "gate=open" >> "$GITHUB_OUTPUT"
            echo "visual=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" = pull_request ]; then
            echo "a pull request was opened, reopened or marked ready"
          elif [ "$EVENT" = workflow_dispatch ] && [ "$DISPATCH_VISUAL" = true ]; then
            echo "dispatched with visual: true"
          elif ! open="$(gh api -X GET "repos/$REPO/pulls" -f state=open -f head="$OWNER:$BRANCH" --jq length)"; then
            echo "::warning::could not ask GitHub for open pull requests, so the gate is open"
          elif ! [[ "$open" =~ ^[0-9]+$ ]]; then
            echo "::warning::GitHub answered '${open}' for open pull requests, so the gate is open"
          elif [ "$open" -eq 0 ]; then
            echo "no open pull request for ${BRANCH}: the visual set waits for one"
            echo "gate=deferred" >> "$GITHUB_OUTPUT"
            echo "visual=false" >> "$GITHUB_OUTPUT"
            exit 0
          else
            echo "${open} open pull request(s) for ${BRANCH}"
          fi
          echo "gate=open" >> "$GITHUB_OUTPUT"
          if ! base="$(git merge-base origin/main HEAD)"; then
            echo "::warning::no merge-base with origin/main, so everything runs"
            echo "visual=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Comparing against ${base}"
          # --no-renames: a file moved out of a rendering path is listed under its old path as well.
          git -c core.quotePath=false diff --name-only --no-renames -z "$base" HEAD > "$RUNNER_TEMP/changed"
          node .github/workflows/scripts/changes.mjs < "$RUNNER_TEMP/changed" >> "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  # Prettier is enforced on the files a change adds or modifies, not the whole tree: most existing
  # files predate the check, and reformatting all of them at once is a separate decision.
  prettier:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Check changed files
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$REF" = "refs/heads/main" ]; then
            base="$PUSH_BEFORE"
          else
            base="$(git merge-base origin/main HEAD)"
          fi
          # A first push to main reports an all-zero "before"; fall back to the parent commit.
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD^)"
          fi
          echo "Comparing against ${base}"
          # quotePath=false: non-ASCII names come out raw, not quoted, so Prettier can find them.
          mapfile -t files < <(git -c core.quotePath=false diff --name-only --diff-filter=ACMR "$base" HEAD)
          echo "${#files[@]} changed file(s)"
          if [ "${#files[@]}" -eq 0 ]; then exit 0; fi
          pnpm exec prettier --check --ignore-unknown --no-error-on-unmatched-pattern -- "${files[@]}"

  test:
    name: test (${{ matrix.package }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        package: [engine, inngest, types, scripts, worker, timing]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm --filter @crawlmouse/${{ matrix.package }} test

  # The web suite in three vitest shards: as one job it took 13.5 minutes (run 43056751031) and was
  # cancelled at its 15-minute limit (run 43073710281). The required check `test (web)` is the job
  # below, so the ruleset is unchanged.
  test-web-shard:
    name: test (web, shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm --filter @crawlmouse/web exec vitest run --shard=${{ matrix.shard }}/3

  # `test (web)` passes only when every shard passed; a shard that failed, was cancelled or was
  # skipped fails it.
  test-web:
    name: test (web)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: test-web-shard
    if: ${{ always() }}
    permissions: {}
    steps:
      - name: Every shard of the web suite passed
        env:
          SHARDS: ${{ needs.test-web-shard.result }}
        run: |
          if [ "$SHARDS" = success ]; then
            echo "every shard passed"
            exit 0
          fi
          echo "::error::test-web-shard is '${SHARDS}'"
          exit 1

  test-templates:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm test:templates

  # next build with placeholder values only (apps/web/.env.ci, and the three below). No real key is
  # present, so nothing can reach Supabase, Stripe or Sentry. The one outbound call is next/font/google
  # fetching fonts. The build is kept for the two jobs that run it on next start.
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: next build (apps/web)
        working-directory: apps/web
        env:
          # So security-browser sees the third parties the CSP allows, with values that point nowhere:
          # Cloudflare's documented always-pass Turnstile test sitekey, a PostHog key no project has,
          # a Sentry DSN on a .invalid host (apps/web/__tests__/security/browser/build-env.ts).
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
          NEXT_PUBLIC_POSTHOG_KEY: ci-placeholder-posthog-key
          NEXT_PUBLIC_SENTRY_DSN: https://ciplaceholder@o0.ingest.sentry.invalid/0
        run: |
          set -euo pipefail
          set -a
          . ./.env.ci
          set +a
          pnpm build
      # Named by the run, not the attempt: "Re-run failed jobs" re-runs the two jobs that download it
      # without re-running a build that passed, so they must find the earlier attempt's upload. A
      # full re-run builds again under the same name, hence overwrite.
      - name: Keep the build for security-browser and zap-baseline
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: next-build-${{ github.run_id }}
          overwrite: true
          path: |
            apps/web/.next
            !apps/web/.next/cache
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # The security headers, the cross-site refusal and the report-only CSP, checked on next start of
  # the build above (docs/specs/v2/sec-baseline.md). Same runner image and checkout path as build, so
  # the downloaded .next starts as it was built.
  security-browser:
    needs: [build, changes]
    if: needs.changes.outputs.visual == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      NEXT_PUBLIC_POSTHOG_KEY: ci-placeholder-posthog-key
      NEXT_PUBLIC_SENTRY_DSN: https://ciplaceholder@o0.ingest.sentry.invalid/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: next-build-${{ github.run_id }}
          path: apps/web/.next
      - name: Install Chromium
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium
      - name: Headers, cross-site refusal and CSP on next start
        working-directory: apps/web
        run: |
          set -euo pipefail
          set -a
          . ./.env.ci
          set +a
          pnpm exec playwright test -c __tests__/security/browser/playwright.config.ts

  # ZAP's passive baseline over next start of the build above: advisory until its first findings are
  # triaged (docs/specs/v2/sec-baseline.md), within six minutes, its reports kept as an artifact.
  # /r/ci-fixture has no database behind it in CI, so ZAP sees the not-found page there.
  zap-baseline:
    needs: [build, changes]
    if: needs.changes.outputs.visual == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    continue-on-error: true
    env:
      # renovate: datasource=docker depName=ghcr.io/zaproxy/zaproxy
      ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:stable@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: next-build-${{ github.run_id }}
          path: apps/web/.next
      - name: Pull the ZAP image
        run: docker pull "$ZAP_IMAGE"
      - name: next start
        working-directory: apps/web
        run: |
          set -euo pipefail
          set -a
          . ./.env.ci
          set +a
          setsid pnpm exec next start -p 3000 > "$RUNNER_TEMP/next.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/health > /dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/next.log"
          exit 1
      - name: ZAP baseline
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/zap"
          chmod 777 "$RUNNER_TEMP/zap"
          cat > "$RUNNER_TEMP/zap/plan.yaml" <<'PLAN'
          env:
            contexts:
              - name: crawlmouse
                urls: [http://localhost:3000]
                includePaths: ['http://localhost:3000.*']
            parameters:
              failOnError: true
              progressToStdout: true
          jobs:
            - type: requestor
              requests:
                - url: http://localhost:3000/
                - url: http://localhost:3000/pricing
                - url: http://localhost:3000/login
                - url: http://localhost:3000/r/ci-fixture
                - url: http://localhost:3000/api/health
            - type: spider
              parameters: { context: crawlmouse, maxDuration: 1 }
            - type: passiveScan-wait
              parameters: { maxDuration: 2 }
            - type: report
              parameters: { template: traditional-html, reportDir: /zap/wrk, reportFile: zap-report.html }
            - type: report
              parameters: { template: traditional-json, reportDir: /zap/wrk, reportFile: zap-report.json }
          PLAN
          docker run --rm --network host -v "$RUNNER_TEMP/zap:/zap/wrk:rw" "$ZAP_IMAGE" \
            zap.sh -cmd -silent -autorun /zap/wrk/plan.yaml
      - name: Keep the ZAP reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zap-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/zap/zap-report.*
          if-no-files-found: warn

  # CodeQL's security-extended queries over the JavaScript and TypeScript, test code left out. A result whose rule has
  # security-severity 7.0 or more (high or critical) fails the job unless the reviewed baseline
  # (.github/workflows/scripts/codeql-baseline.json, by fingerprint, expiring 2026-12-08) lists it; read
  # from the SARIF by .github/workflows/scripts/sarif-gate.mjs, which also fails a scan that extracted
  # no file. Results upload to code scanning from every run that scans.
  #
  # Code scanning is not available on a private repository without GitHub Advanced Security, so the
  # job runs only while the repository is public; once it is private the job is skipped, not failed.
  # The nightly run skips it too: main's push runs scanned the same commits, and the visibility is
  # read from the event's `repository`, which the schedule event is not relied on to carry.
  codeql:
    if: ${{ github.event_name != 'schedule' && !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
          # Test code is not shipped: its local fixture servers echo request paths into test pages,
          # which CodeQL reads as reflected XSS (three results on the first run, 2026-11-08).
          config: |
            paths-ignore:
              - '**/*.test.ts'
              - '**/*.test.tsx'
              - '**/__tests__/**'
              - '**/tests/**'
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:javascript-typescript
          output: ${{ runner.temp }}/codeql
          upload: always
      - name: Fail on a high or critical result
        run: node .github/workflows/scripts/sarif-gate.mjs "$RUNNER_TEMP/codeql" .github/workflows/scripts/codeql-baseline.json

  # Semgrep CE with four registry packs, in CI only: nothing is uploaded to code scanning. The image
  # is pinned by digest; the packs are fetched at run time and are not pinned, so the log's rule
  # count shows when one changes. Test code is excluded as in the codeql job. Semgrep's built-in
  # ignore list (used when the repository has no .semgrepignore) skips every `build/` directory,
  # which holds engine source (packages/engine/src/v2/build), so the job writes a .semgrepignore
  # with no pattern first. Without --error Semgrep exits 0 on findings, so the gate treats any
  # other exit as a failed scan; it also fails on an ERROR result the reviewed baseline does not
  # accept, and on a scan that read no file or ran too few rules (--time lists them).
  semgrep:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # renovate: datasource=docker depName=semgrep/semgrep
      SEMGREP_IMAGE: semgrep/semgrep:1.182.1@sha256:451b3d875c00dac7ed5db5293e584a07de11449a409c10b3c2d2652f429630b6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: semgrep
        id: scan
        run: |
          set -uo pipefail
          echo "# No pattern: replaces Semgrep's built-in list; the exclusions are the --exclude flags." > .semgrepignore
          mkdir -p "$RUNNER_TEMP/semgrep"
          status=0
          # safe.directory, as in the gitleaks job: without it git refuses the mounted checkout
          # (another owner), and Semgrep's git-based target listing needs git.
          docker run --rm -v "$PWD:/src" -w /src -v "$RUNNER_TEMP/semgrep:/out" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/src \
            -e SEMGREP_ENABLE_VERSION_CHECK=0 "$SEMGREP_IMAGE" \
            semgrep scan --metrics=off --time \
            --config p/typescript --config p/javascript --config p/nodejs --config p/react \
            --exclude '*.test.ts' --exclude '*.test.tsx' --exclude __tests__ --exclude tests \
            --text --json-output=/out/semgrep.json || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Upload the Semgrep JSON
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semgrep-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/semgrep/semgrep.json
          retention-days: 7
          if-no-files-found: warn
      - name: Fail on an ERROR result or a scan that cannot be trusted
        if: ${{ !cancelled() }}
        env:
          SCAN_EXIT: ${{ steps.scan.outputs.status }}
        run: |
          node .github/workflows/scripts/semgrep-gate.mjs "$RUNNER_TEMP/semgrep/semgrep.json" \
            .github/workflows/scripts/semgrep-baseline.json --repo-root . --scan-exit "${SCAN_EXIT:-missing}"

  # The v2 design-system harness (tests/visual): screenshots of the preview pages at 1280 and
  # 390 px, light and dark, failing on a diff above 0.2%, plus layout, axe, focus and motion checks.
  # It runs in the Playwright image pinned by digest, so the fonts and rasteriser that drew the
  # baselines are the ones that check them. The preview pages exist only under `next dev`, with
  # the placeholder env from apps/web/.env.ci. On a failure each shard re-runs its screenshots with
  # --update-snapshots and uploads them as proposed baselines, next to the diffs; nothing is
  # committed from CI. tests/visual/README.md says how to accept them.
  #
  # Six shards, each under its own 90 minutes. One runner ran past 45 minutes once the segment
  # previews were added (owner ruling, CC-23). In run 43280365648 shard 1 took 55.7 min and shard 6
  # reached its 60-minute limit: 45.4 min of checks, then "Propose baselines" cancelled at 13.8 min,
  # so the run left no artifact (CC-28, owner ruling 4).
  #
  # Each shard runs twice, once per half of the preview routes (`part`, VISUAL_PART in
  # tests/visual/part.ts), each on its own runner and its own `next dev`. The harness keeps every
  # compiled route, and one server holding all 149 crossed Next's restart line (used heap above 80% of
  # its limit) while warming, in every shard of dispatches 43399235243 and 43421508188: measured at
  # CI's heap limit, ~57 MB of live heap per route, a restart after route 132 (CC-31, Q51). The specs
  # that do not loop over the previews run in part 1 only; the production-build steps run on shard 1,
  # part 1, over every route.
  #
  # Skipped when the `changes` job finds nothing on the branch that can affect rendering.
  visual-shard:
    needs: changes
    if: needs.changes.outputs.visual == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
        part: [1, 2]
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble@sha256:9bd26ad900bb5e0f4dee75839e957a89ae89c2b7ab1e76050e559790e946b948
    # Steps in a container job default to sh, which has no `set -o pipefail`.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Visual, layout and accessibility checks
        working-directory: apps/web
        env:
          VISUAL_PART: ${{ matrix.part }}/2
        run: |
          set -euo pipefail
          set -a
          . ./.env.ci
          set +a
          status=0
          pnpm exec playwright test -c ../../tests/visual/playwright.config.ts --shard=${{ matrix.shard }}/6 || status=$?
          # Kept for "Propose baselines": a later Playwright step in this shard clears the output folder.
          cp test-results/visual/.last-run.json "$RUNNER_TEMP/visual-last-run.json" 2>/dev/null || true
          exit "$status"
      # The performance budgets and the production checks run on the production build, so shard 1
      # builds it once the next dev run above has finished (one build or server at a time). They
      # run whether or not the screenshots above matched: a baseline waiting to be redrawn says
      # nothing about performance, and their numbers are wanted on every run.
      - name: Production build for the budgets
        if: ${{ matrix.shard == 1 && matrix.part == 1 && !cancelled() }}
        working-directory: apps/web
        run: |
          set -euo pipefail
          set -a
          . ./.env.ci
          set +a
          pnpm exec next build
      # A fixed CPU workload timed on this runner, against its time on a runner of normal speed
      # (packages/timing/src/probe.ts). The budgets step reads it when deciding what a failure means.
      - name: Runner probe
        if: ${{ matrix.shard == 1 && matrix.part == 1 && !cancelled() }}
        run: |
          set -euo pipefail
          pnpm --silent --filter @crawlmouse/timing exec tsx src/probe-cli.ts | tee "$RUNNER_TEMP/probe.json"
      # Alone and on one worker, so they measure the page and not the other specs. next start
      # serves the previews only with V2_PREVIEW_ON_NEXT_START=1, which playwright.config.ts sets
      # for VISUAL_SERVER=start. perf-retry.sh runs the budgets and reads attempt 1 first: a failure
      # that is not a budget miss fails the job at once; a budget-only failure is retried once,
      # and the second attempt and the probe decide; docs/ops/ci-timing.md has the
      # rule. This is the one retried step in the workflow.
      - name: Performance budgets, on next start
        if: ${{ matrix.shard == 1 && matrix.part == 1 && !cancelled() }}
        working-directory: apps/web
        env:
          VISUAL_PERF: '1'
          VISUAL_SERVER: start
          # Relative to apps/web: the repository root, where the upload below finds it.
          FLAKE_ENTRY: ../../flake-entry.md
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          set -euo pipefail
          set -a
          . ./.env.ci
          set +a
          export PERF_PROBE="$RUNNER_TEMP/probe.json"
          ../../packages/timing/scripts/perf-retry.sh "$RUNNER_TEMP/probe.json" -- \
            pnpm exec playwright test -c ../../tests/visual/playwright.config.ts perf.spec.ts --workers=1
      - name: Production checks, on next start
        if: ${{ matrix.shard == 1 && matrix.part == 1 && !cancelled() }}
        working-directory: apps/web
        env:
          VISUAL_SERVER: start
        run: |
          set -euo pipefail
          set -a
          . ./.env.ci
          set +a
          pnpm exec playwright test -c ../../tests/visual/playwright.config.ts production.spec.ts --workers=1
      # A budget failure that passed on retry, or failed twice on a slow runner, leaves a row for
      # the flake register in docs/ops/ci-timing.md. The PR author commits it.
      - name: Upload the flake register row
        if: ${{ matrix.shard == 1 && matrix.part == 1 && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flake-entry-${{ github.run_id }}-${{ github.run_attempt }}
          path: flake-entry.md
          retention-days: 30
          if-no-files-found: ignore
      - name: On any Vercel environment the previews are a 404
        if: ${{ matrix.shard == 1 && matrix.part == 1 && !cancelled() }}
        working-directory: apps/web
        run: |
          set -euo pipefail
          set -a
          . ./.env.ci
          set +a
          ../../tests/visual/vercel-guard.sh
      - name: Propose baselines from this run
        if: failure()
        working-directory: apps/web
        env:
          VISUAL_PART: ${{ matrix.part }}/2
        run: |
          set -uo pipefail
          set -a
          . ./.env.ci
          set +a
          # Redraw exactly the screenshots this shard failed on: a sharded visual.spec.ts alone splits the
          # tests differently from the run above, so it would redraw another shard's screenshots.
          mkdir -p test-results/visual
          cp "$RUNNER_TEMP/visual-last-run.json" test-results/visual/.last-run.json 2>/dev/null || true
          pnpm exec playwright test -c ../../tests/visual/playwright.config.ts visual.spec.ts --last-failed --update-snapshots=all || true
      - name: Upload proposed baselines and diffs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-${{ github.run_id }}-${{ github.run_attempt }}-shard${{ matrix.shard }}-part${{ matrix.part }}
          path: |
            tests/visual/__snapshots__/
            apps/web/test-results/visual/
            apps/web/playwright-report/visual/
          retention-days: 14
          if-no-files-found: warn

  # The check named `visual`, as before the shards, for branch protection and for a reader of the
  # PR. It passes when every shard passed, or when the shards were skipped because the `changes` job
  # passed and set visual=false. Everything else fails: a shard that failed or was cancelled, and
  # shards skipped because `changes` itself failed or was cancelled.
  #
  # When the gate deferred the visual set the job is renamed, so a push with no open pull request
  # reports no check named `visual` and the ruleset's requirement stays unmet. Only an explicit
  # `deferred` renames it: a failed `changes` leaves the name `visual`, and the rule fails it.
  visual:
    name: "${{ needs.changes.outputs.gate == 'deferred' && 'visual (deferred: no open pull request)' || 'visual' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [changes, visual-shard]
    if: ${{ always() }}
    permissions: {}
    steps:
      - name: Every shard passed, or nothing that can affect rendering changed
        env:
          SHARDS: ${{ needs.visual-shard.result }}
          CHANGES: ${{ needs.changes.result }}
          VISUAL: ${{ needs.changes.outputs.visual }}
          GATE: ${{ needs.changes.outputs.gate }}
        run: |
          set -euo pipefail
          echo "changes: $CHANGES (gate=${GATE}, visual=${VISUAL}); visual-shard: $SHARDS"
          if [ "$SHARDS" = success ]; then
            exit 0
          fi
          if [ "$SHARDS" = skipped ] && [ "$CHANGES" = success ] && [ "$VISUAL" = false ]; then
            if [ "$GATE" = deferred ]; then
              echo "no open pull request, so the shards wait for one; this check is not the required one"
            else
              echo "nothing that can affect rendering changed, so the shards were skipped"
            fi
            exit 0
          fi
          if [ "$CHANGES" != success ]; then
            echo "::error::the changes job is '$CHANGES', so whether the visuals were needed is unknown"
          else
            echo "::error::visual-shard is '$SHARDS' with visual=${VISUAL}"
          fi
          exit 1

  # gitleaks over the FULL history of every ref (gitleaks' default git log is
  # `--full-history --all`), hence fetch-depth: 0. Pinned by image digest.
  #
  # gitleaks exits 0 when git itself fails (it logs ERR and reports "0 commits scanned. no leaks
  # found"), which is a silent pass. The first version of this job did exactly that: git refused the
  # mounted repo as "dubious ownership". So safe.directory is passed explicitly, and the job fails on
  # any gitleaks error or on a scan that covered no commits.
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # renovate: datasource=docker depName=ghcr.io/gitleaks/gitleaks
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        run: |
          set -uo pipefail
          docker run --rm -v "$PWD:/repo" -w /repo \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            "$GITLEAKS_IMAGE" git --redact --verbose --no-banner --exit-code 1 /repo 2>&1 \
            | sed -E 's/\x1b\[[0-9;]*m//g' | tee "$RUNNER_TEMP/gitleaks.log"
          status=${PIPESTATUS[0]}
          scanned=$(sed -nE 's/.* ([0-9]+) commits scanned\..*/\1/p' "$RUNNER_TEMP/gitleaks.log" | tail -n 1)
          echo "non-merge commits on all refs: $(git rev-list --all --no-merges --count); gitleaks scanned: ${scanned:-none}"
          if grep -qE '^[0-9:APM]+ ERR ' "$RUNNER_TEMP/gitleaks.log"; then
            echo "::error::gitleaks logged an error, so its result cannot be trusted"
            exit 1
          fi
          if [ -z "$scanned" ] || [ "$scanned" -eq 0 ]; then
            echo "::error::gitleaks scanned no commits"
            exit 1
          fi
          exit "$status"

  # osv-scanner on the lockfile, with the CC-00 baseline in osv-scanner.toml (each entry expires).
  # The image's default entrypoint maps exit code 128 (no packages found) to success; calling the
  # binary directly keeps a non-zero exit a failure.
  osv-scanner:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: osv-scanner
        uses: docker://ghcr.io/google/osv-scanner-action:v2.7.0@sha256:d54770fe0b09493894e76a02aaed9f51a0513fa57c5186452a755d257b0068a6
        with:
          entrypoint: /root/osv-scanner
          args: scan source --config=osv-scanner.toml --lockfile=pnpm-lock.yaml

  # Migration files are append-only: once on main, a migration file is applied or about to be, and
  # an edit would never reach production (scripts/db/dry-run.ts refuses it too, but the dry run runs
  # only on pull requests that touch the database). This job runs on every push, so it can be a
  # required check.
  migrations-append-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Migration files are only ever added
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # On main a push compares with what main was before it; a dispatched or nightly run has no
          # `before`, so it compares with the first parent.
          if [ "$REF" = "refs/heads/main" ] && [ "$EVENT" = push ]; then
            base="$PUSH_BEFORE"
          elif [ "$REF" = "refs/heads/main" ]; then
            base="$(git rev-parse HEAD^)"
          else
            base="$(git merge-base origin/main HEAD)"
          fi
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "::error::cannot find the commit to compare against ($base)"
            exit 1
          fi
          # Anything but an added file: modified, deleted, renamed, changed in type (a file swapped
          # for a symlink), copied over.
          changed=$(git diff --name-status --diff-filter=a "$base" HEAD -- infra/supabase/migrations)
          if [ -n "$changed" ]; then
            echo "$changed"
            echo "::error::an existing migration file changed; add a new migration instead"
            exit 1
          fi
          echo "only added migration files since $base"

  # actionlint over the workflows, with shellcheck on their run blocks (both are in the image).
  # Pinned by image digest. nightly.yml runs on its own with two findings ignored that predate this
  # job: the skipped Lighthouse placeholder (`if: false`) and an `ls` in its run block (SC2012,
  # info). The other workflows run with no ignores.
  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # renovate: datasource=docker depName=rhysd/actionlint
      ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          set -euo pipefail
          mapfile -t files < <(find .github/workflows -name '*.yml' ! -name nightly.yml | sort)
          docker run --rm -v "$PWD:/repo" -w /repo "$ACTIONLINT_IMAGE" -color "${files[@]}"
          docker run --rm -v "$PWD:/repo" -w /repo "$ACTIONLINT_IMAGE" -color \
            -ignore 'constant expression "false" in condition' -ignore 'SC2012:' \
            .github/workflows/nightly.yml

  # The real Supabase CLI, against an empty Postgres, lists exactly the files of
  # infra/supabase/migrations (scripts/db/verify-cli-files.ts). The unit test pins the wrapper's
  # list; this pins what the CLI itself reads. The same Postgres then hosts the 006c race test, which
  # needs two real transactions open at once (PGlite has one backend).
  db-cli-files:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/supabase-cli
      - name: The CLI reads infra/supabase/migrations
        working-directory: scripts
        env:
          DB_URL: postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable
          # The CLI opens with TLS unless told not to; the service container has none.
          PGSSLMODE: disable
        run: pnpm exec tsx db/verify-cli-files.ts
      - name: Two transactions race in start_trial_with_ledger (006c)
        working-directory: scripts
        env:
          TRIAL_RACE_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable
          # Fail, rather than skip, if the URL ever goes missing.
          TRIAL_RACE_REQUIRED: '1'
        # A renamed or missing file must fail the step, not pass it with no tests.
        run: pnpm exec vitest run db/trial-race.test.ts --passWithNoTests=false
      - name: Two transactions race in apply_stripe_event (CC-03)
        working-directory: scripts
        env:
          TRIAL_RACE_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable
          TRIAL_RACE_REQUIRED: '1'
        run: pnpm exec vitest run db/stripe-event-race.test.ts --passWithNoTests=false
      - name: Two transactions race in the site and re-check caps (CC-26b)
        working-directory: scripts
        env:
          TRIAL_RACE_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable
          TRIAL_RACE_REQUIRED: '1'
        run: pnpm exec vitest run db/sites-race.test.ts --passWithNoTests=false
      - name: Two transactions race in mark done and persist (CC-26b)
        working-directory: scripts
        env:
          TRIAL_RACE_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable
          TRIAL_RACE_REQUIRED: '1'
        run: pnpm exec vitest run db/fixes-race.test.ts --passWithNoTests=false
      - name: Two transactions race in the mail and schedule claims (CC-28)
        working-directory: scripts
        env:
          TRIAL_RACE_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable
          TRIAL_RACE_REQUIRED: '1'
        run: pnpm exec vitest run db/monitoring-race.test.ts --passWithNoTests=false
      - name: Two transactions race in start_agency_trial_account (CC-29)
        working-directory: scripts
        env:
          TRIAL_RACE_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable
          TRIAL_RACE_REQUIRED: '1'
        run: pnpm exec vitest run db/agency-trial-race.test.ts --passWithNoTests=false
      - name: A person who used an Agency trial, and two first calls at once (CC-37)
        working-directory: scripts
        env:
          TRIAL_RACE_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable
          TRIAL_RACE_REQUIRED: '1'
        run: pnpm exec vitest run db/agency-trial-repeat-race.test.ts --passWithNoTests=false
      - name: Two transactions race for an account's last seat (CC-31)
        working-directory: scripts
        env:
          TRIAL_RACE_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable
          TRIAL_RACE_REQUIRED: '1'
        run: pnpm exec vitest run db/seats-race.test.ts --passWithNoTests=false
      - name: A recipient's refusal over a client's rows, and two calls at once (CC-31)
        working-directory: scripts
        env:
          TRIAL_RACE_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable
          TRIAL_RACE_REQUIRED: '1'
        run: pnpm exec vitest run db/report-links-race.test.ts --passWithNoTests=false
