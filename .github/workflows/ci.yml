name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read

# A newer push to a branch cancels its older run. On main each commit gets its own group, so no main
# run is cancelled or replaced: GitHub also drops a PENDING run when a newer one joins its group, and the
# Prettier job on main checks only what that push added.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  # Prettier is enforced on the files a change adds or modifies, not the whole tree: most existing
  # files predate the check, and reformatting all of them at once is a separate decision.
  prettier:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Check changed files
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # The checkout is GitHub's merge commit; its first parent is the base it merged against.
            base="$(git rev-parse HEAD^1)"
          elif [ "$REF" = "refs/heads/main" ]; then
            base="$PUSH_BEFORE"
          else
            base="$(git merge-base origin/main HEAD)"
          fi
          # A first push to main reports an all-zero "before"; fall back to the parent commit.
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD^)"
          fi
          echo "Comparing against ${base}"
          # quotePath=false: non-ASCII names come out raw, not quoted, so Prettier can find them.
          mapfile -t files < <(git -c core.quotePath=false diff --name-only --diff-filter=ACMR "$base" HEAD)
          echo "${#files[@]} changed file(s)"
          if [ "${#files[@]}" -eq 0 ]; then exit 0; fi
          pnpm exec prettier --check --ignore-unknown --no-error-on-unmatched-pattern -- "${files[@]}"

  test:
    name: test (${{ matrix.package }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [engine, web, inngest, types, scripts, worker, timing]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm --filter @crawlmouse/${{ matrix.package }} test

  test-templates:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm test:templates

  # next build with placeholder values only (apps/web/.env.ci). No real key is present, so nothing
  # can reach Supabase, Stripe or Sentry. The one outbound call is next/font/google fetching fonts.
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: next build (apps/web)
        working-directory: apps/web
        run: |
          set -euo pipefail
          set -a
          . ./.env.ci
          set +a
          pnpm build

  # The v2 design-system harness (tests/visual): screenshots of the preview pages at 1280 and
  # 390 px, light and dark, failing on a diff above 0.2%, plus layout, axe, focus and motion checks.
  # It runs in the Playwright image pinned by digest, so the fonts and rasteriser that drew the
  # baselines are the ones that check them. The preview pages exist only under `next dev`, with
  # the placeholder env from apps/web/.env.ci. On a failure each shard re-runs its screenshots with
  # --update-snapshots and uploads them as proposed baselines, next to the diffs; nothing is
  # committed from CI. tests/visual/README.md says how to accept them.
  #
  # Four shards, each under its own 45 minutes: one runner ran past that limit once the segment
  # previews were added (owner ruling, CC-23).
  visual-shard:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble@sha256:9bd26ad900bb5e0f4dee75839e957a89ae89c2b7ab1e76050e559790e946b948
    # Steps in a container job default to sh, which has no `set -o pipefail`.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Visual, layout and accessibility checks
        working-directory: apps/web
        run: |
          set -euo pipefail
          set -a
          . ./.env.ci
          set +a
          status=0
          pnpm exec playwright test -c ../../tests/visual/playwright.config.ts --shard=${{ matrix.shard }}/6 || status=$?
          # Kept for "Propose baselines": a later Playwright step in this shard clears the output folder.
          cp test-results/visual/.last-run.json "$RUNNER_TEMP/visual-last-run.json" 2>/dev/null || true
          exit "$status"
      # The performance budgets and the production checks run on the production build, so shard 1
      # builds it once the next dev run above has finished (one build or server at a time). They
      # run whether or not the screenshots above matched: a baseline waiting to be redrawn says
      # nothing about performance, and their numbers are wanted on every run.
      - name: Production build for the budgets
        if: ${{ matrix.shard == 1 && !cancelled() }}
        working-directory: apps/web
        run: |
          set -euo pipefail
          set -a
          . ./.env.ci
          set +a
          pnpm exec next build
      # A fixed CPU workload timed on this runner, against its time on a runner of normal speed
      # (packages/timing/src/probe.ts). The budgets step reads it when deciding what a failure means.
      - name: Runner probe
        if: ${{ matrix.shard == 1 && !cancelled() }}
        run: |
          set -euo pipefail
          pnpm --silent --filter @crawlmouse/timing exec tsx src/probe-cli.ts | tee "$RUNNER_TEMP/probe.json"
      # Alone and on one worker, so they measure the page and not the other specs. next start
      # serves the previews only with V2_PREVIEW_ON_NEXT_START=1, which playwright.config.ts sets
      # for VISUAL_SERVER=start. perf-retry.sh runs the budgets and reads attempt 1 first: a failure
      # that is not a budget miss fails the job at once; a budget-only failure is retried once,
      # and the second attempt and the probe decide; docs/ops/ci-timing.md has the
      # rule. This is the one retried step in the workflow.
      - name: Performance budgets, on next start
        if: ${{ matrix.shard == 1 && !cancelled() }}
        working-directory: apps/web
        env:
          VISUAL_PERF: '1'
          VISUAL_SERVER: start
          # Relative to apps/web: the repository root, where the upload below finds it.
          FLAKE_ENTRY: ../../flake-entry.md
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          set -euo pipefail
          set -a
          . ./.env.ci
          set +a
          ../../packages/timing/scripts/perf-retry.sh "$RUNNER_TEMP/probe.json" -- \
            pnpm exec playwright test -c ../../tests/visual/playwright.config.ts perf.spec.ts --workers=1
      - name: Production checks, on next start
        if: ${{ matrix.shard == 1 && !cancelled() }}
        working-directory: apps/web
        env:
          VISUAL_SERVER: start
        run: |
          set -euo pipefail
          set -a
          . ./.env.ci
          set +a
          pnpm exec playwright test -c ../../tests/visual/playwright.config.ts production.spec.ts --workers=1
      # A budget failure that passed on retry, or failed twice on a slow runner, leaves a row for
      # the flake register in docs/ops/ci-timing.md. The PR author commits it.
      - name: Upload the flake register row
        if: ${{ matrix.shard == 1 && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flake-entry-${{ github.run_id }}-${{ github.run_attempt }}
          path: flake-entry.md
          retention-days: 30
          if-no-files-found: ignore
      - name: On any Vercel environment the previews are a 404
        if: ${{ matrix.shard == 1 && !cancelled() }}
        working-directory: apps/web
        run: |
          set -euo pipefail
          set -a
          . ./.env.ci
          set +a
          ../../tests/visual/vercel-guard.sh
      - name: Propose baselines from this run
        if: failure()
        working-directory: apps/web
        run: |
          set -uo pipefail
          set -a
          . ./.env.ci
          set +a
          # Redraw exactly the screenshots this shard failed on: a sharded visual.spec.ts alone splits the
          # tests differently from the run above, so it would redraw another shard's screenshots.
          mkdir -p test-results/visual
          cp "$RUNNER_TEMP/visual-last-run.json" test-results/visual/.last-run.json 2>/dev/null || true
          pnpm exec playwright test -c ../../tests/visual/playwright.config.ts visual.spec.ts --last-failed --update-snapshots=all || true
      - name: Upload proposed baselines and diffs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-${{ github.run_id }}-${{ github.run_attempt }}-shard${{ matrix.shard }}
          path: |
            tests/visual/__snapshots__/
            apps/web/test-results/visual/
            apps/web/playwright-report/visual/
          retention-days: 14
          if-no-files-found: warn

  # The check named `visual`, as before the shards, for branch protection and for a reader of the
  # PR: it passes only when every shard passed, and fails on a shard that failed, was cancelled or
  # was skipped.
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: visual-shard
    if: ${{ always() }}
    permissions: {}
    steps:
      - name: Every shard passed
        env:
          SHARDS: ${{ needs.visual-shard.result }}
        run: |
          echo "visual-shard: $SHARDS"
          test "$SHARDS" = success

  # gitleaks over the FULL history of every ref (gitleaks' default git log is
  # `--full-history --all`), hence fetch-depth: 0. Pinned by image digest.
  #
  # gitleaks exits 0 when git itself fails (it logs ERR and reports "0 commits scanned. no leaks
  # found"), which is a silent pass. The first version of this job did exactly that: git refused the
  # mounted repo as "dubious ownership". So safe.directory is passed explicitly, and the job fails on
  # any gitleaks error or on a scan that covered no commits.
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # renovate: datasource=docker depName=ghcr.io/gitleaks/gitleaks
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        run: |
          set -uo pipefail
          docker run --rm -v "$PWD:/repo" -w /repo \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            "$GITLEAKS_IMAGE" git --redact --verbose --no-banner --exit-code 1 /repo 2>&1 \
            | sed -E 's/\x1b\[[0-9;]*m//g' | tee "$RUNNER_TEMP/gitleaks.log"
          status=${PIPESTATUS[0]}
          scanned=$(sed -nE 's/.* ([0-9]+) commits scanned\..*/\1/p' "$RUNNER_TEMP/gitleaks.log" | tail -n 1)
          echo "non-merge commits on all refs: $(git rev-list --all --no-merges --count); gitleaks scanned: ${scanned:-none}"
          if grep -qE '^[0-9:APM]+ ERR ' "$RUNNER_TEMP/gitleaks.log"; then
            echo "::error::gitleaks logged an error, so its result cannot be trusted"
            exit 1
          fi
          if [ -z "$scanned" ] || [ "$scanned" -eq 0 ]; then
            echo "::error::gitleaks scanned no commits"
            exit 1
          fi
          exit "$status"

  # osv-scanner on the lockfile, with the CC-00 baseline in osv-scanner.toml (each entry expires).
  # The image's default entrypoint maps exit code 128 (no packages found) to success; calling the
  # binary directly keeps a non-zero exit a failure.
  osv-scanner:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: osv-scanner
        uses: docker://ghcr.io/google/osv-scanner-action:v2.7.0@sha256:d54770fe0b09493894e76a02aaed9f51a0513fa57c5186452a755d257b0068a6
        with:
          entrypoint: /root/osv-scanner
          args: scan source --config=osv-scanner.toml --lockfile=pnpm-lock.yaml

  # actionlint over the workflows, with shellcheck on their run blocks (both are in the image).
  # Pinned by image digest. nightly.yml runs on its own with two findings ignored that predate this
  # job: the skipped Lighthouse placeholder (`if: false`) and an `ls` in its run block (SC2012,
  # info). The other workflows run with no ignores.
  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # renovate: datasource=docker depName=rhysd/actionlint
      ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          set -euo pipefail
          mapfile -t files < <(find .github/workflows -name '*.yml' ! -name nightly.yml | sort)
          docker run --rm -v "$PWD:/repo" -w /repo "$ACTIONLINT_IMAGE" -color "${files[@]}"
          docker run --rm -v "$PWD:/repo" -w /repo "$ACTIONLINT_IMAGE" -color \
            -ignore 'constant expression "false" in condition' -ignore 'SC2012:' \
            .github/workflows/nightly.yml

  # The real Supabase CLI, against an empty Postgres, lists exactly the files of
  # infra/supabase/migrations (scripts/db/verify-cli-files.ts). The unit test pins the wrapper's
  # list; this pins what the CLI itself reads.
  db-cli-files:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/supabase-cli
      - name: The CLI reads infra/supabase/migrations
        working-directory: scripts
        env:
          DB_URL: postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable
          # The CLI opens with TLS unless told not to; the service container has none.
          PGSSLMODE: disable
        run: pnpm exec tsx db/verify-cli-files.ts
