name: CI

# Pushes only: a pull request's checks are the ones its head commit's push ran. protect-main requires
# the branch to be up to date with main before merging, so the tested head carries main's tree.
on:
  push:
    branches: ['**']

permissions:
  contents: read

# A newer push to a branch cancels its older run. On main each commit gets its own group, so no main
# run is cancelled or replaced: GitHub also drops a PENDING run when a newer one joins its group, and the
# Prettier job on main checks only what that push added.
concurrency:
  group: ci-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  # Prettier is enforced on the files a change adds or modifies, not the whole tree: most existing
  # files predate the check, and reformatting all of them at once is a separate decision.
  prettier:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Check changed files
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$REF" = "refs/heads/main" ]; then
            base="$PUSH_BEFORE"
          else
            base="$(git merge-base origin/main HEAD)"
          fi
          # A first push to main reports an all-zero "before"; fall back to the parent commit.
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD^)"
          fi
          echo "Comparing against ${base}"
          # quotePath=false: non-ASCII names come out raw, not quoted, so Prettier can find them.
          mapfile -t files < <(git -c core.quotePath=false diff --name-only --diff-filter=ACMR "$base" HEAD)
          echo "${#files[@]} changed file(s)"
          if [ "${#files[@]}" -eq 0 ]; then exit 0; fi
          pnpm exec prettier --check --ignore-unknown --no-error-on-unmatched-pattern -- "${files[@]}"

  test:
    name: test (${{ matrix.package }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [engine, web, inngest, types, scripts, worker, timing]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm --filter @crawlmouse/${{ matrix.package }} test

  test-templates:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm test:templates

  # next build with placeholder values only (apps/web/.env.ci, and the three below). No real key is
  # present, so nothing can reach Supabase, Stripe or Sentry. The one outbound call is next/font/google
  # fetching fonts. The build is kept for the two jobs that run it on next start.
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: next build (apps/web)
        working-directory: apps/web
        env:
          # So security-browser sees the third parties the CSP allows, with values that point nowhere:
          # Cloudflare's documented always-pass Turnstile test sitekey, a PostHog key no project has,
          # a Sentry DSN on a .invalid host (apps/web/__tests__/security/browser/build-env.ts).
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
          NEXT_PUBLIC_POSTHOG_KEY: ci-placeholder-posthog-key
          NEXT_PUBLIC_SENTRY_DSN: https://ciplaceholder@o0.ingest.sentry.invalid/0
        run: |
          set -euo pipefail
          set -a
          . ./.env.ci
          set +a
          pnpm build
      - name: Keep the build for security-browser and zap-baseline
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: next-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/web/.next
            !apps/web/.next/cache
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # The security headers, the cross-site refusal and the report-only CSP, checked on next start of
  # the build above (docs/specs/v2/sec-baseline.md). Same runner image and checkout path as build, so
  # the downloaded .next starts as it was built.
  security-browser:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      NEXT_PUBLIC_POSTHOG_KEY: ci-placeholder-posthog-key
      NEXT_PUBLIC_SENTRY_DSN: https://ciplaceholder@o0.ingest.sentry.invalid/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: next-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/web/.next
      - name: Install Chromium
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium
      - name: Headers, cross-site refusal and CSP on next start
        working-directory: apps/web
        run: |
          set -euo pipefail
          set -a
          . ./.env.ci
          set +a
          pnpm exec playwright test -c __tests__/security/browser/playwright.config.ts

  # ZAP's passive baseline over next start of the build above: advisory until its first findings are
  # triaged (docs/specs/v2/sec-baseline.md), within six minutes, its reports kept as an artifact.
  # /r/ci-fixture has no database behind it in CI, so ZAP sees the not-found page there.
  zap-baseline:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    continue-on-error: true
    env:
      # renovate: datasource=docker depName=ghcr.io/zaproxy/zaproxy
      ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:stable@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: next-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/web/.next
      - name: Pull the ZAP image
        run: docker pull "$ZAP_IMAGE"
      - name: next start
        working-directory: apps/web
        run: |
          set -euo pipefail
          set -a
          . ./.env.ci
          set +a
          setsid pnpm exec next start -p 3000 > "$RUNNER_TEMP/next.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/health > /dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/next.log"
          exit 1
      - name: ZAP baseline
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/zap"
          chmod 777 "$RUNNER_TEMP/zap"
          cat > "$RUNNER_TEMP/zap/plan.yaml" <<'PLAN'
          env:
            contexts:
              - name: crawlmouse
                urls: [http://localhost:3000]
                includePaths: ['http://localhost:3000.*']
            parameters:
              failOnError: true
              progressToStdout: true
          jobs:
            - type: requestor
              requests:
                - url: http://localhost:3000/
                - url: http://localhost:3000/pricing
                - url: http://localhost:3000/login
                - url: http://localhost:3000/r/ci-fixture
                - url: http://localhost:3000/api/health
            - type: spider
              parameters: { context: crawlmouse, maxDuration: 1 }
            - type: passiveScan-wait
              parameters: { maxDuration: 2 }
            - type: report
              parameters: { template: traditional-html, reportDir: /zap/wrk, reportFile: zap-report.html }
            - type: report
              parameters: { template: traditional-json, reportDir: /zap/wrk, reportFile: zap-report.json }
          PLAN
          docker run --rm --network host -v "$RUNNER_TEMP/zap:/zap/wrk:rw" "$ZAP_IMAGE" \
            zap.sh -cmd -silent -autorun /zap/wrk/plan.yaml
      - name: Keep the ZAP reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zap-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/zap/zap-report.*
          if-no-files-found: warn

  # CodeQL's security-extended queries over the JavaScript and TypeScript, test code left out. A result whose rule has
  # security-severity 7.0 or more (high or critical) fails the job unless the reviewed baseline
  # (.github/workflows/scripts/codeql-baseline.json, by fingerprint, expiring 2026-12-08) lists it; read
  # from the SARIF by .github/workflows/scripts/sarif-gate.mjs, which also fails a scan that extracted
  # no file. Results
  # upload to code scanning from this repository's own pushes and pull requests: a fork's token cannot
  # write them, and the gate still runs on its SARIF.
  codeql:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
          # Test code is not shipped: its local fixture servers echo request paths into test pages,
          # which CodeQL reads as reflected XSS (three results on the first run, 2026-11-08).
          config: |
            paths-ignore:
              - '**/*.test.ts'
              - '**/*.test.tsx'
              - '**/__tests__/**'
              - '**/tests/**'
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:javascript-typescript
          output: ${{ runner.temp }}/codeql
          upload: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && 'always' || 'never' }}
      - name: Fail on a high or critical result
        run: node .github/workflows/scripts/sarif-gate.mjs "$RUNNER_TEMP/codeql" .github/workflows/scripts/codeql-baseline.json

  # The v2 design-system harness (tests/visual): screenshots of the preview pages at 1280 and
  # 390 px, light and dark, failing on a diff above 0.2%, plus layout, axe, focus and motion checks.
  # It runs in the Playwright image pinned by digest, so the fonts and rasteriser that drew the
  # baselines are the ones that check them. The preview pages exist only under `next dev`, with
  # the placeholder env from apps/web/.env.ci. On a failure each shard re-runs its screenshots with
  # --update-snapshots and uploads them as proposed baselines, next to the diffs; nothing is
  # committed from CI. tests/visual/README.md says how to accept them.
  #
  # Four shards, each under its own 45 minutes: one runner ran past that limit once the segment
  # previews were added (owner ruling, CC-23).
  visual-shard:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble@sha256:9bd26ad900bb5e0f4dee75839e957a89ae89c2b7ab1e76050e559790e946b948
    # Steps in a container job default to sh, which has no `set -o pipefail`.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Visual, layout and accessibility checks
        working-directory: apps/web
        run: |
          set -euo pipefail
          set -a
          . ./.env.ci
          set +a
          status=0
          pnpm exec playwright test -c ../../tests/visual/playwright.config.ts --shard=${{ matrix.shard }}/6 || status=$?
          # Kept for "Propose baselines": a later Playwright step in this shard clears the output folder.
          cp test-results/visual/.last-run.json "$RUNNER_TEMP/visual-last-run.json" 2>/dev/null || true
          exit "$status"
      # The performance budgets and the production checks run on the production build, so shard 1
      # builds it once the next dev run above has finished (one build or server at a time). They
      # run whether or not the screenshots above matched: a baseline waiting to be redrawn says
      # nothing about performance, and their numbers are wanted on every run.
      - name: Production build for the budgets
        if: ${{ matrix.shard == 1 && !cancelled() }}
        working-directory: apps/web
        run: |
          set -euo pipefail
          set -a
          . ./.env.ci
          set +a
          pnpm exec next build
      # A fixed CPU workload timed on this runner, against its time on a runner of normal speed
      # (packages/timing/src/probe.ts). The budgets step reads it when deciding what a failure means.
      - name: Runner probe
        if: ${{ matrix.shard == 1 && !cancelled() }}
        run: |
          set -euo pipefail
          pnpm --silent --filter @crawlmouse/timing exec tsx src/probe-cli.ts | tee "$RUNNER_TEMP/probe.json"
      # Alone and on one worker, so they measure the page and not the other specs. next start
      # serves the previews only with V2_PREVIEW_ON_NEXT_START=1, which playwright.config.ts sets
      # for VISUAL_SERVER=start. perf-retry.sh runs the budgets and reads attempt 1 first: a failure
      # that is not a budget miss fails the job at once; a budget-only failure is retried once,
      # and the second attempt and the probe decide; docs/ops/ci-timing.md has the
      # rule. This is the one retried step in the workflow.
      - name: Performance budgets, on next start
        if: ${{ matrix.shard == 1 && !cancelled() }}
        working-directory: apps/web
        env:
          VISUAL_PERF: '1'
          VISUAL_SERVER: start
          # Relative to apps/web: the repository root, where the upload below finds it.
          FLAKE_ENTRY: ../../flake-entry.md
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          set -euo pipefail
          set -a
          . ./.env.ci
          set +a
          ../../packages/timing/scripts/perf-retry.sh "$RUNNER_TEMP/probe.json" -- \
            pnpm exec playwright test -c ../../tests/visual/playwright.config.ts perf.spec.ts --workers=1
      - name: Production checks, on next start
        if: ${{ matrix.shard == 1 && !cancelled() }}
        working-directory: apps/web
        env:
          VISUAL_SERVER: start
        run: |
          set -euo pipefail
          set -a
          . ./.env.ci
          set +a
          pnpm exec playwright test -c ../../tests/visual/playwright.config.ts production.spec.ts --workers=1
      # A budget failure that passed on retry, or failed twice on a slow runner, leaves a row for
      # the flake register in docs/ops/ci-timing.md. The PR author commits it.
      - name: Upload the flake register row
        if: ${{ matrix.shard == 1 && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flake-entry-${{ github.run_id }}-${{ github.run_attempt }}
          path: flake-entry.md
          retention-days: 30
          if-no-files-found: ignore
      - name: On any Vercel environment the previews are a 404
        if: ${{ matrix.shard == 1 && !cancelled() }}
        working-directory: apps/web
        run: |
          set -euo pipefail
          set -a
          . ./.env.ci
          set +a
          ../../tests/visual/vercel-guard.sh
      - name: Propose baselines from this run
        if: failure()
        working-directory: apps/web
        run: |
          set -uo pipefail
          set -a
          . ./.env.ci
          set +a
          # Redraw exactly the screenshots this shard failed on: a sharded visual.spec.ts alone splits the
          # tests differently from the run above, so it would redraw another shard's screenshots.
          mkdir -p test-results/visual
          cp "$RUNNER_TEMP/visual-last-run.json" test-results/visual/.last-run.json 2>/dev/null || true
          pnpm exec playwright test -c ../../tests/visual/playwright.config.ts visual.spec.ts --last-failed --update-snapshots=all || true
      - name: Upload proposed baselines and diffs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-${{ github.run_id }}-${{ github.run_attempt }}-shard${{ matrix.shard }}
          path: |
            tests/visual/__snapshots__/
            apps/web/test-results/visual/
            apps/web/playwright-report/visual/
          retention-days: 14
          if-no-files-found: warn

  # The check named `visual`, as before the shards, for branch protection and for a reader of the
  # PR: it passes only when every shard passed, and fails on a shard that failed, was cancelled or
  # was skipped.
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: visual-shard
    if: ${{ always() }}
    permissions: {}
    steps:
      - name: Every shard passed
        env:
          SHARDS: ${{ needs.visual-shard.result }}
        run: |
          echo "visual-shard: $SHARDS"
          test "$SHARDS" = success

  # gitleaks over the FULL history of every ref (gitleaks' default git log is
  # `--full-history --all`), hence fetch-depth: 0. Pinned by image digest.
  #
  # gitleaks exits 0 when git itself fails (it logs ERR and reports "0 commits scanned. no leaks
  # found"), which is a silent pass. The first version of this job did exactly that: git refused the
  # mounted repo as "dubious ownership". So safe.directory is passed explicitly, and the job fails on
  # any gitleaks error or on a scan that covered no commits.
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # renovate: datasource=docker depName=ghcr.io/gitleaks/gitleaks
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        run: |
          set -uo pipefail
          docker run --rm -v "$PWD:/repo" -w /repo \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            "$GITLEAKS_IMAGE" git --redact --verbose --no-banner --exit-code 1 /repo 2>&1 \
            | sed -E 's/\x1b\[[0-9;]*m//g' | tee "$RUNNER_TEMP/gitleaks.log"
          status=${PIPESTATUS[0]}
          scanned=$(sed -nE 's/.* ([0-9]+) commits scanned\..*/\1/p' "$RUNNER_TEMP/gitleaks.log" | tail -n 1)
          echo "non-merge commits on all refs: $(git rev-list --all --no-merges --count); gitleaks scanned: ${scanned:-none}"
          if grep -qE '^[0-9:APM]+ ERR ' "$RUNNER_TEMP/gitleaks.log"; then
            echo "::error::gitleaks logged an error, so its result cannot be trusted"
            exit 1
          fi
          if [ -z "$scanned" ] || [ "$scanned" -eq 0 ]; then
            echo "::error::gitleaks scanned no commits"
            exit 1
          fi
          exit "$status"

  # osv-scanner on the lockfile, with the CC-00 baseline in osv-scanner.toml (each entry expires).
  # The image's default entrypoint maps exit code 128 (no packages found) to success; calling the
  # binary directly keeps a non-zero exit a failure.
  osv-scanner:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: osv-scanner
        uses: docker://ghcr.io/google/osv-scanner-action:v2.7.0@sha256:d54770fe0b09493894e76a02aaed9f51a0513fa57c5186452a755d257b0068a6
        with:
          entrypoint: /root/osv-scanner
          args: scan source --config=osv-scanner.toml --lockfile=pnpm-lock.yaml

  # Migration files are append-only: once on main, a migration file is applied or about to be, and
  # an edit would never reach production (scripts/db/dry-run.ts refuses it too, but the dry run runs
  # only on pull requests that touch the database). This job runs on every push, so it can be a
  # required check.
  migrations-append-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Migration files are only ever added
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$REF" = "refs/heads/main" ]; then
            base="$PUSH_BEFORE"
          else
            base="$(git merge-base origin/main HEAD)"
          fi
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "::error::cannot find the commit to compare against ($base)"
            exit 1
          fi
          # Anything but an added file: modified, deleted, renamed, changed in type (a file swapped
          # for a symlink), copied over.
          changed=$(git diff --name-status --diff-filter=a "$base" HEAD -- infra/supabase/migrations)
          if [ -n "$changed" ]; then
            echo "$changed"
            echo "::error::an existing migration file changed; add a new migration instead"
            exit 1
          fi
          echo "only added migration files since $base"

  # actionlint over the workflows, with shellcheck on their run blocks (both are in the image).
  # Pinned by image digest. nightly.yml runs on its own with two findings ignored that predate this
  # job: the skipped Lighthouse placeholder (`if: false`) and an `ls` in its run block (SC2012,
  # info). The other workflows run with no ignores.
  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # renovate: datasource=docker depName=rhysd/actionlint
      ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          set -euo pipefail
          mapfile -t files < <(find .github/workflows -name '*.yml' ! -name nightly.yml | sort)
          docker run --rm -v "$PWD:/repo" -w /repo "$ACTIONLINT_IMAGE" -color "${files[@]}"
          docker run --rm -v "$PWD:/repo" -w /repo "$ACTIONLINT_IMAGE" -color \
            -ignore 'constant expression "false" in condition' -ignore 'SC2012:' \
            .github/workflows/nightly.yml

  # The real Supabase CLI, against an empty Postgres, lists exactly the files of
  # infra/supabase/migrations (scripts/db/verify-cli-files.ts). The unit test pins the wrapper's
  # list; this pins what the CLI itself reads. The same Postgres then hosts the 006c race test, which
  # needs two real transactions open at once (PGlite has one backend).
  db-cli-files:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/supabase-cli
      - name: The CLI reads infra/supabase/migrations
        working-directory: scripts
        env:
          DB_URL: postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable
          # The CLI opens with TLS unless told not to; the service container has none.
          PGSSLMODE: disable
        run: pnpm exec tsx db/verify-cli-files.ts
      - name: Two transactions race in start_trial_with_ledger (006c)
        working-directory: scripts
        env:
          TRIAL_RACE_DB_URL: postgresql://postgres:postgres@localhost:5432/postgres?sslmode=disable
          # Fail, rather than skip, if the URL ever goes missing.
          TRIAL_RACE_REQUIRED: '1'
        # A renamed or missing file must fail the step, not pass it with no tests.
        run: pnpm exec vitest run db/trial-race.test.ts --passWithNoTests=false
