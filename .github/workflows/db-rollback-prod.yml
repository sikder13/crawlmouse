name: DB rollback on production

# Runs one tracked rollback file on production when the owner dispatches it from main: the file's
# bytes and the deletion of its migration's history row, in one transaction, then the checks and the
# fingerprint. db-apply-prod.yml never runs a rollback; this workflow is the only way one reaches
# production. docs/ops/db-migrations.md is the runbook.
#
# The approval is the owner's own dispatch. The `production` environment holds the production
# secrets and deploys from main only; it has no required reviewer, because on a private repository
# under a personal GitHub Pro account environment reviewers are not enforced. The `authorize` job
# (no environment, no secret, no permission) refuses unless the run is a workflow_dispatch from
# main, dispatched and run by the repository owner, and `plan` and `rollback` run the same check
# as their first step: a re-run of a failed job does not re-run a passed `authorize`, and only a
# step in the re-run job sees who re-ran it (github.triggering_actor).
#
# What the check tells apart is accounts, not the owner's own tools: any token that acts as the
# owner and can write Actions (a `gh` login included) passes it.

on:
  workflow_dispatch:
    inputs:
      file:
        description: The rollback file in infra/supabase/rollbacks, e.g. 20261102000003_v2_007_storage.revert.sql
        required: true
        type: string

permissions:
  contents: read

# A group of its own: GitHub replaces a pending run in a group when a newer one queues, so sharing
# db-apply-prod.yml's group would let an apply dispatched while a rollback waits drop the rollback,
# or the reverse.
concurrency:
  group: db-production-rollback
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Only the owner, dispatching from main
        env:
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          refuse() {
            echo "::error::$1"
            exit 1
          }
          [ -n "$OWNER" ] || refuse "the repository owner is empty"
          [ "$EVENT" = workflow_dispatch ] || refuse "started by the event '$EVENT', not workflow_dispatch"
          [ "$ACTOR" = "$OWNER" ] || refuse "dispatched by '$ACTOR', not the owner '$OWNER'"
          [ "$TRIGGERING_ACTOR" = "$OWNER" ] || refuse "run or re-run by '$TRIGGERING_ACTOR', not the owner '$OWNER'"
          [ "$REF" = refs/heads/main ] || refuse "dispatched from '$REF', not refs/heads/main"
          echo "dispatched and run by the owner '$OWNER', from main"

  plan:
    needs: authorize
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Holds SUPABASE_ACCESS_TOKEN, used here only through the read-only query endpoint.
    environment: db-dry-run
    outputs:
      sha256: ${{ steps.plan.outputs.sha256 }}
    steps:
      - name: Only the owner, dispatching from main
        env:
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          refuse() {
            echo "::error::$1"
            exit 1
          }
          [ -n "$OWNER" ] || refuse "the repository owner is empty"
          [ "$EVENT" = workflow_dispatch ] || refuse "started by the event '$EVENT', not workflow_dispatch"
          [ "$ACTOR" = "$OWNER" ] || refuse "dispatched by '$ACTOR', not the owner '$OWNER'"
          [ "$TRIGGERING_ACTOR" = "$OWNER" ] || refuse "run or re-run by '$TRIGGERING_ACTOR', not the owner '$OWNER'"
          [ "$REF" = refs/heads/main ] || refuse "dispatched from '$REF', not refs/heads/main"
          echo "dispatched and run by the owner '$OWNER', from main"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: The file, its sha256, and that it is the newest applied migration
        id: plan
        working-directory: scripts
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          FILE: ${{ inputs.file }}
        run: |
          set -euo pipefail
          pnpm exec tsx db/production.ts rollback-plan --yes-production --file "$FILE" \
            --sha-out "$RUNNER_TEMP/sha256"
          sha=$(cat "$RUNNER_TEMP/sha256")
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"

  rollback:
    needs: [authorize, plan]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Holds SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD; deployment branches: main only. No
    # reviewer: the owner's dispatch is the approval, checked by the first step.
    environment: production
    permissions:
      contents: read
    steps:
      - name: Only the owner, dispatching from main
        env:
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          refuse() {
            echo "::error::$1"
            exit 1
          }
          [ -n "$OWNER" ] || refuse "the repository owner is empty"
          [ "$EVENT" = workflow_dispatch ] || refuse "started by the event '$EVENT', not workflow_dispatch"
          [ "$ACTOR" = "$OWNER" ] || refuse "dispatched by '$ACTOR', not the owner '$OWNER'"
          [ "$TRIGGERING_ACTOR" = "$OWNER" ] || refuse "run or re-run by '$TRIGGERING_ACTOR', not the owner '$OWNER'"
          [ "$REF" = refs/heads/main ] || refuse "dispatched from '$REF', not refs/heads/main"
          echo "dispatched and run by the owner '$OWNER', from main"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Run the rollback
        working-directory: scripts
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          # Passed as data and checked against infra/supabase/rollbacks by the script.
          FILE: ${{ inputs.file }}
          SHA256: ${{ needs.plan.outputs.sha256 }}
        run: |
          pnpm exec tsx db/production.ts rollback --yes-production --file "$FILE" \
            --expect-sha256 "$SHA256"

  report:
    needs: [authorize, plan, rollback]
    if: ${{ failure() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open an issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FILE: ${{ inputs.file }}
        run: |
          gh issue create --repo "$REPO" \
            --title "Production rollback failed" \
            --body "The rollback of \`$FILE\` on production failed: $RUN_URL. docs/ops/db-migrations.md says how to read the job summary."
