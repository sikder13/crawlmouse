name: DB apply to production

# Applies pending migration files to production when the owner dispatches it from main. Nothing
# starts it on its own: merging a pull request does not. docs/ops/db-migrations.md is the runbook.
#
#   authorize  no environment, no secret, no permission: refuses unless the run is a
#              workflow_dispatch from main, dispatched and run by the repository owner.
#   plan       read-only: finds the merged pull request and its passed dry run, reads production's
#              pending files and refuses any the dry run did not apply byte for byte. The job
#              summary lists each pending file with its sha256, next to the dry run's.
#   apply      bound to the `production` environment, which holds the production secrets and
#              deploys from main only. It re-checks the files against the manifest and production's
#              fingerprint against the one the plan read, runs `supabase db push`, the checks and
#              the fingerprint. It never retries and never runs a rollback.
#   report     opens an issue when any job fails.
#
# The owner dispatches it from main, then approves the `production` environment. Its required
# reviewer (the owner) is enforced while the repository is public; on a private repository under a
# personal GitHub Pro account it is not, and the dispatch alone starts the job
# (docs/specs/v2/repo-private.md, D1). So `plan` and `apply` each run the same check as `authorize` as their first step, before anything
# is checked out or any secret is read. A re-run of a failed job does not re-run a passed
# `authorize`, and only a step in the re-run job sees who re-ran it (github.triggering_actor).
#
# What the check tells apart is accounts, not the owner's own tools: any token that acts as the
# owner and can write Actions (a `gh` login included) passes it.

on:
  workflow_dispatch:
    inputs:
      dry_run_pr:
        description: The merged pull request whose passed dry run covers the pending files
        required: true
        type: number

permissions:
  contents: read

# One production apply at a time, and none cancelled midway.
concurrency:
  group: db-production
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Only the owner, dispatching from main
        env:
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          refuse() {
            echo "::error::$1"
            exit 1
          }
          [ -n "$OWNER" ] || refuse "the repository owner is empty"
          [ "$EVENT" = workflow_dispatch ] || refuse "started by the event '$EVENT', not workflow_dispatch"
          [ "$ACTOR" = "$OWNER" ] || refuse "dispatched by '$ACTOR', not the owner '$OWNER'"
          [ "$TRIGGERING_ACTOR" = "$OWNER" ] || refuse "run or re-run by '$TRIGGERING_ACTOR', not the owner '$OWNER'"
          [ "$REF" = refs/heads/main ] || refuse "dispatched from '$REF', not refs/heads/main"
          echo "dispatched and run by the owner '$OWNER', from main"

  plan:
    needs: authorize
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Holds SUPABASE_ACCESS_TOKEN, used here only through the read-only query endpoint.
    environment: db-dry-run
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      manifest: ${{ steps.plan.outputs.manifest }}
      production: ${{ steps.plan.outputs.production }}
      pending: ${{ steps.plan.outputs.pending }}
    steps:
      - name: Only the owner, dispatching from main
        env:
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          refuse() {
            echo "::error::$1"
            exit 1
          }
          [ -n "$OWNER" ] || refuse "the repository owner is empty"
          [ "$EVENT" = workflow_dispatch ] || refuse "started by the event '$EVENT', not workflow_dispatch"
          [ "$ACTOR" = "$OWNER" ] || refuse "dispatched by '$ACTOR', not the owner '$OWNER'"
          [ "$TRIGGERING_ACTOR" = "$OWNER" ] || refuse "run or re-run by '$TRIGGERING_ACTOR', not the owner '$OWNER'"
          [ "$REF" = refs/heads/main ] || refuse "dispatched from '$REF', not refs/heads/main"
          echo "dispatched and run by the owner '$OWNER', from main"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Find the pull request's passed dry run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          INPUT_PR: ${{ inputs.dry_run_pr }}
        run: |
          set -euo pipefail
          pr="$INPUT_PR"
          if ! [[ "$pr" =~ ^[0-9]+$ ]]; then
            echo "::error::dry_run_pr is not a pull request number ($pr)"
            exit 1
          fi
          state=$(gh pr view "$pr" --repo "$REPO" --json state --jq .state)
          head=$(gh pr view "$pr" --repo "$REPO" --json headRefOid --jq .headRefOid)
          if [ "$state" != "MERGED" ]; then
            echo "::error::pull request #$pr is $state, not merged"
            exit 1
          fi
          # The newest completed dry run at the pull request's head must be the one that passed.
          latest=$(gh run list --repo "$REPO" --workflow db-dry-run.yml --commit "$head" \
            --event pull_request --status completed --limit 1 --json databaseId,conclusion \
            --jq '.[0] // empty | "\(.databaseId) \(.conclusion)"')
          run="${latest%% *}"
          conclusion="${latest#* }"
          if [ -z "$latest" ] || [ "$conclusion" != "success" ]; then
            echo "::error::the newest dry run for pull request #$pr at $head did not pass (${latest:-none})"
            exit 1
          fi
          echo "pull request #$pr, dry run https://github.com/$REPO/actions/runs/$run"
          gh run download "$run" --repo "$REPO" -n db-dry-run-summary -D "$RUNNER_TEMP/dry-run"
      - name: Pending files, checked against the dry run
        id: plan
        working-directory: scripts
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          pnpm exec tsx db/production.ts plan --yes-production \
            --dry-run-summary "$RUNNER_TEMP/dry-run/db-dry-run-summary.json" \
            --manifest-out "$RUNNER_TEMP/manifest.json" \
            --production-out "$RUNNER_TEMP/production.json"
          manifest=$(cat "$RUNNER_TEMP/manifest.json")
          pending=$(jq length "$RUNNER_TEMP/manifest.json")
          production=$(cat "$RUNNER_TEMP/production.json")
          {
            echo "manifest=$manifest"
            echo "production=$production"
            echo "pending=$pending"
          } >> "$GITHUB_OUTPUT"

  apply:
    needs: [authorize, plan]
    if: needs.plan.outputs.pending != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Holds SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD; deployment branches: main only. Waits
    # for the owner's approval while the repository is public; the first step checks the dispatch.
    environment: production
    permissions:
      contents: read
    steps:
      - name: Only the owner, dispatching from main
        env:
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          refuse() {
            echo "::error::$1"
            exit 1
          }
          [ -n "$OWNER" ] || refuse "the repository owner is empty"
          [ "$EVENT" = workflow_dispatch ] || refuse "started by the event '$EVENT', not workflow_dispatch"
          [ "$ACTOR" = "$OWNER" ] || refuse "dispatched by '$ACTOR', not the owner '$OWNER'"
          [ "$TRIGGERING_ACTOR" = "$OWNER" ] || refuse "run or re-run by '$TRIGGERING_ACTOR', not the owner '$OWNER'"
          [ "$REF" = refs/heads/main ] || refuse "dispatched from '$REF', not refs/heads/main"
          echo "dispatched and run by the owner '$OWNER', from main"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/supabase-cli
      - name: supabase db push to production
        working-directory: scripts
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          MANIFEST: ${{ needs.plan.outputs.manifest }}
          PRODUCTION: ${{ needs.plan.outputs.production }}
        run: |
          set -euo pipefail
          printf '%s' "$MANIFEST" > "$RUNNER_TEMP/manifest.json"
          printf '%s' "$PRODUCTION" > "$RUNNER_TEMP/production.json"
          pnpm exec tsx db/production.ts apply --yes-production \
            --manifest "$RUNNER_TEMP/manifest.json" --expect-production "$RUNNER_TEMP/production.json"

  report:
    needs: [authorize, plan, apply]
    if: ${{ failure() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open an issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          gh issue create --repo "$REPO" \
            --title "Production migration run failed at ${SHA:0:8}" \
            --body "The production migration workflow failed: $RUN_URL. Nothing is retried. docs/ops/db-migrations.md says how to read the job summary."
