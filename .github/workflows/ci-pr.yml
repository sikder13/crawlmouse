name: CI on a pull request

# When a pull request is opened, reopened or marked ready, its head branch gets one CI run with the
# visual set: this workflow dispatches ci.yml there with `visual: true` (a dispatch sent with the
# workflow's own token starts a run). The dispatched run is an ordinary run of every job on the head
# commit, not only the visual set: a job skipped by a condition reports success, and a skipped twin
# of a required check on the same commit could stand in for one that failed. Later pushes to the
# branch run the visual set themselves, because the pull request is open (ci.yml, `changes`).
# docs/specs/v2/ci-cost.md has the rules.

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions: {}

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dispatch:
    # A pull request from a fork gets a read-only token, so it could not dispatch anyway.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Run CI on the head branch, with the visual set
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: gh workflow run ci.yml --repo "$REPO" --ref "$HEAD_REF" -f visual=true
