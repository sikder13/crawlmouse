name: Nightly

on:
  schedule:
    - cron: '0 3 * * *' # 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm test
      - run: pnpm test:templates

  # PLACEHOLDER: the Lighthouse and cross-browser runs land in a later step. Skipped until then.
  lighthouse-and-cross-browser:
    if: false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: echo "placeholder for the Lighthouse and cross-browser runs"
