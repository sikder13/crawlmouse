name: Supabase CLI
description: >-
  Install the Supabase CLI release that scripts/db/supabase-cli.ts names, from its GitHub release
  tarball, refusing a tarball whose sha256 is not the one pinned here, and put it on PATH.

runs:
  using: composite
  steps:
    - name: Install supabase 2.84.2
      shell: bash
      env:
        VERSION: 2.84.2
        # From supabase_2.84.2_checksums.txt on the release, re-computed from the tarball itself.
        SHA256: 620a5f6ea7b60f9b4fe112a5d72464ea0e53d04022035641674a2e6d121e0eb5
      run: |
        set -euo pipefail
        dir="$RUNNER_TEMP/supabase-cli"
        mkdir -p "$dir"
        curl -sSfL -o "$dir/supabase.tar.gz" \
          "https://github.com/supabase/cli/releases/download/v${VERSION}/supabase_linux_amd64.tar.gz"
        echo "${SHA256}  $dir/supabase.tar.gz" | sha256sum --check --strict
        tar -xzf "$dir/supabase.tar.gz" -C "$dir" supabase
        echo "$dir" >> "$GITHUB_PATH"
        "$dir/supabase" --version
