# (curl -sS https://api.osv.dev/v1/vulns/GHSA-fc5q-39xc-vjpf | jq '.affected[].ranges').
# Build-time tooling only, transitive: @sentry/nextjs > @rollup/plugin-commonjs > picomatch@4.0.4,
# and tailwindcss (dev) > micromatch > picomatch@2.3.2 (pnpm why -r picomatch). No package.json
# names it (git ls-files '*package.json' | xargs grep -l '"picomatch"' prints nothing). No path for
# a visitor's pattern: no runtime source imports picomatch, micromatch or minimatch
# (grep -rlE "from ['\"](picomatch|micromatch|minimatch)['\"]" apps/web/lib apps/web/app
# packages/engine/src packages/worker/src inngest prints nothing).
