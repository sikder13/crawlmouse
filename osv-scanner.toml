# Published after the baseline and recorded on 2026-10-31, the day CI first reported them. Not from the
# CC-00 scan: the only fixed versions are new majors, pulled in transitively by eslint, typescript-eslint,
# @sentry/nextjs's bundler plugin and crawlee, which pin the old majors. Re-accepted 2026-11-24 to
# 2026-12-10 with the 14 above, by the same owner approval. minimatch 9.0.9 is in production through
# @crawlee/core: each enqueueLinks call compiles `http{s,}://<origin>/**` from the page's own origin,
# unescaped (enqueue_links.js:99; packages/engine/src/crawler.ts, `same-hostname`). WHATWG URL parsing
# keeps braces and `*` in a hostname, and nothing in our code refuses them (normalizeDomain,
# validateUrlOrThrow). What stops it today is Node's resolver, measured 2026-11-24 on Node 22.23 and
# glibc 2.35: `{a,b}.lab.crawlmouse.com` resolves in public DNS through our wildcard record, but
# dns.lookup answers ENOTFOUND and dns.resolve4 EBADNAME, so no page of such a host is fetched and no
# pattern is built from it. Not measured on the Vercel or Fly runtimes. If reached, a 247-character
# brace hostname costs 4.3 s and 57,142 patterns per compile (v2r/qa/findings/osv-left-for-owner.md).

[[IgnoredVulns]]
id = "GHSA-3g3m-2fjr-6pw4"
ignoreUntil = 2026-12-10
reason = "Re-accepted to 2026-12-10 by the owner on 2026-11-24. Published 2026-10-31 (medium): glob@13.0.6 (fixed: 14.0.2, a new major), via @sentry/bundler-plugin-core"

