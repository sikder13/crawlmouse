# The crawl worker on staging. No addresses and no secrets here: the two secrets
# (WORKER_SIGNING_SECRET, WORKER_JWT_PUBLIC_KEY) are set with `flyctl secrets set`;
# see docs/ops/worker-runbook.md.
app = "crawlmouse-worker-staging"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "5s"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  MAX_CONCURRENT_BATCHES = "4"
  # The engine's page extractor computes AI-legibility signals by default; the worker discards them.
  AI_READINESS_EXTRACTION = "0"
  # Old space 256 MB; V8 adds about 48 MB of young generation. The stored results (64 MiB of Buffers)
  # and the runtime (about 90 MB at idle) sit outside that limit. src/deploy-files.test.ts adds them up.
  NODE_OPTIONS = "--max-old-space-size=256"

[http_service]
  internal_port = 8080
  force_https = true
  # Never stopped by the platform: a batch runs for minutes after its 202, in this machine's memory.
  auto_stop_machines = "off"
  auto_start_machines = false
  # One machine: batch records and nonces are per process. The deploy passes --ha=false to match.
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/healthz"
    timeout = "3s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
