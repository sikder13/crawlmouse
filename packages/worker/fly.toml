# The crawl worker on staging. No addresses and no secrets here: the two secrets
# (WORKER_SIGNING_SECRET, WORKER_JWT_PUBLIC_KEY) are set with `flyctl secrets set`;
# see docs/ops/worker-runbook.md.
app = "crawlmouse-worker-staging"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "5s"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  # Batches run at once. Two on one shared vCPU until utilisation is measured on Fly itself.
  BATCH_CONCURRENCY = "2"
  # The engine's page extractor computes AI-legibility signals by default; the worker discards them.
  AI_READINESS_EXTRACTION = "0"
  # Old space 256 MB, and young-generation semi-spaces of 4 MB, which lowered the peak in each load
  # case with no visible cost in time. src/load.test.ts runs four batches at once against 10 MB pages
  # with these options and the result store full, and holds the peak resident memory to a fixed bound
  # well under the VM below (see PEAK_RSS_MIB there).
  NODE_OPTIONS = "--max-old-space-size=256 --max-semi-space-size=4"

[http_service]
  internal_port = 8080
  force_https = true
  # Never stopped by the platform: a batch runs for minutes after its 202, in this machine's memory.
  auto_stop_machines = "off"
  auto_start_machines = false
  # One machine: batch records and nonces are per process. The deploy passes --ha=false to match.
  min_machines_running = 1

  # At most this many requests reach the worker at once, so at most this many 1 MiB request bodies
  # are buffered; past it the proxy queues them.
  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 25

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/healthz"
    timeout = "3s"

# Fly's default is on-failure, 10 tries in 5 minutes, then the Machine stays stopped; with
# auto_start_machines off, nothing would start it again before the next deploy.
[[restart]]
  policy = "always"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"
